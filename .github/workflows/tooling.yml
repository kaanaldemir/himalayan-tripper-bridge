name: Research tooling
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - shell: pwsh
        run: ./tools/prepare-tools.ps1
      - run: javac --class-path .local/tools/jadx-headless.jar -d .local/classes tools/ApkInspector.java
      - run: javac --class-path .local/tools/apksig.jar -d .local/classes tools/ApkVerify.java
